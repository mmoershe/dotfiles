# Application bindings
$terminal = uwsm-app -- $TERMINAL
$browser = omarchy-launch-browser

# Unbinding Omarchy defaults

unbind = SUPER, H
unbind = SUPER, J
unbind = SUPER, K
unbind = SUPER, L
unbind = SUPER, W
unbind = SUPER_SHIFT, H
unbind = SUPER_SHIFT, J
unbind = SUPER_SHIFT, K
unbind = SUPER_SHIFT, L
unbind = SUPER_SHIFT, B

# Navigation

## Move focus with vim keys
bindd = SUPER, h, Move focus left, movefocus, l
bindd = SUPER, j, Move focus down, movefocus, d
bindd = SUPER, k, Move focus up, movefocus, u
bindd = SUPER, l, Move focus right, movefocus, r
bindd = SUPER SHIFT, h, Move window to the left, movewindow, l
bindd = SUPER SHIFT, j, Move window below, movewindow, d
bindd = SUPER SHIFT, k, Move window above, movewindow, u
bindd = SUPER SHIFT, l, Move window to the right, movewindow, r

# Workspaces

# Main
bindd = SUPER, RETURN, Switch to workspace 1, workspace, 1
bindd = SUPER SHIFT, RETURN, Move window to workspace 1, movetoworkspacesilent, 1

# Terminal 2
bindd = SUPER, N, Switch to workspace 2, workspace, 2
bindd = SUPER SHIFT, N, Move window to workspace 2, movetoworkspacesilent, 2

# VSCodium (up for change)
bindd = SUPER, M, Switch to workspace 3, workspace, 3
bindd = SUPER SHIFT, M, Move window to workspace 3, movetoworkspacesilent, 3

# Browser
bindd = SUPER, B, Switch to workspace 4, workspace, 4
bindd = SUPER SHIFT, B, Move window to workspace 4, movetoworkspacesilent, 4

# Browser 2
bindd = SUPER, P, Switch to workspace 5, workspace, 5
bindd = SUPER SHIFT, P, Move window to workspace 5, movetoworkspacesilent, 5

# File-Browser
bindd = SUPER, Z, Switch to workspace 6, workspace, 6
bindd = SUPER SHIFT, Z, Move window to workspace 6, movetoworkspacesilent, 6

# Variable
bindd = SUPER, U, Switch to workspace 7, workspace, 7
bindd = SUPER SHIFT, U, Move window to workspace 7, movetoworkspacesilent, 7

# E-Mail
bindd = SUPER, O, Switch to workspace 8, workspace, 8
bindd = SUPER SHIFT, O, Move window to workspace 8, movetoworkspacesilent, 8

# Chat
bindd = SUPER, I, Switch to workspace 9, workspace, 9
bindd = SUPER SHIFT, I, Move window to workspace 9, movetoworkspacesilent, 9

# Game
bindd = SUPER, W, Switch to workspace 10, workspace, 10
bindd = SUPER SHIFT, W, Move window to workspace 10, movetoworkspacesilent, 10


# --------------------- #

bindd = SUPER CTRL, K, Show key bindings, exec, omarchy-menu-keybindings
bindd = SUPER, Q, Close active window, killactive,
bindd = SUPER CTRL, RETURN, Terminal, exec, $terminal --working-directory="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER SHIFT ALT, B, Browser (private), exec, $browser --private
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, T, Activity, exec, $terminal -e btop
bindd = SUPER SHIFT, D, Docker, exec, $terminal -e lazydocker
bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus signal "uwsm-app -- signal-desktop"
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus "^obsidian$" "uwsm-app -- obsidian -disable-gpu --enable-wayland-ime"
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- 1password

# If your web app url contains #, type it as ## to prevent hyperland treat it as comments
bindd = SUPER SHIFT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT ALT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER SHIFT CTRL, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
bindd = SUPER SHIFT, X, X, exec, omarchy-launch-webapp "https://x.com/"
bindd = SUPER SHIFT ALT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu
